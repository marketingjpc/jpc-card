<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>JPC Careers — Join JPC. Build the Future.</title>
<style>
:root{--brand:#db1d18;--ink:#1d1d1f;--sub:#6e6e73;--mute:#86868b;--line:#e8e8ed;--page:#f5f5f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:var(--page)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:32px;padding:32px 32px 28px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.07)}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.tag{font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--brand);margin:6px 0 0}
.logo{width:84px;height:auto;display:block}
h1{font-size:36px;line-height:1.14;font-weight:600;letter-spacing:.01em;margin:40px 0 0}
.team{margin-top:28px}
.zh{font-size:17px;font-weight:600;letter-spacing:.06em;margin:0}
.en{font-size:15px;color:var(--sub);margin:6px 0 0}
.dept{font-size:14px;color:var(--mute);margin:4px 0 0}
.links{margin-top:30px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.row b{display:block;font-size:16px;font-weight:500}
.row span{display:block;font-size:13px;color:var(--mute);margin-top:3px}
.row svg{width:8px;height:14px;flex:none;stroke:#c7c7cc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row:hover b,.row:focus-visible b{color:var(--brand)}
a:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:4px}
.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;width:100%;height:52px;border-radius:26px;font-weight:600;font-size:15px;letter-spacing:.05em;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.9}
.apply{margin-top:28px;background:var(--brand);color:#fff}
.save{margin-top:10px;background:var(--page);color:var(--ink);font-size:14px}
.lang{display:inline-flex;margin-top:14px;padding:3px;border-radius:15px;background:var(--page)}
.lang button{appearance:none;border:0;background:transparent;color:var(--sub);font:600 12px/1 inherit;font-family:inherit;letter-spacing:.04em;padding:7px 12px;border-radius:12px;cursor:pointer;transition:background .15s,color .15s}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lang button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
html[lang="en"] .en{display:none}
</style>
</head>

<script>
(function(){
  var zhSubject="%E6%87%89%E5%BE%B5%E8%81%B7%E4%BD%8D%EF%BC%9A%EF%BC%BF%EF%BC%BF%EF%BC%BF%EF%BC%BF%EF%BC%BF%EF%BC%BF%EF%BD%9C%E5%A7%93%E5%90%8D";
  var T={
    "zh-Hant":{team:"佳必琪國際｜人才招募團隊",jobs:"最新職缺",about:"認識JPC",site:"官網",apply:"投遞履歷",
      hint:"目前的 App 內建瀏覽器可能無法加入通訊錄。請改用 Safari 或 Chrome 開啟本頁。",copy:"複製網址",copied:"已複製，請貼到瀏覽器",
      title:"JPC Careers — Join JPC. Build the Future.",subject:zhSubject},
    "en":{team:"JPC Recruitment Team",jobs:"Latest Openings",about:"About JPC",site:"Website",apply:"Apply Now",
      hint:"In-app browsers may not support saving to contacts. Please open this page in Safari or Chrome.",copy:"Copy link",copied:"Copied. Paste it into your browser.",
      title:"JPC Careers — Join JPC. Build the Future.",subject:encodeURIComponent("Job Application: ______ | Name")}
  };
  var cur="zh-Hant",copyBtn=document.getElementById("copy"),copyState=false;

  function setLang(l,persist){
    if(!T[l])l="zh-Hant";
    cur=l;
    document.documentElement.lang=l;
    document.title=T[l].title;
    var nodes=document.querySelectorAll("[data-i18n]");
    for(var i=0;i<nodes.length;i++){nodes[i].textContent=T[l][nodes[i].getAttribute("data-i18n")];}
    document.querySelector(".apply").href="mailto:HR@jpcco.com?subject="+T[l].subject;
    copyBtn.textContent=copyState?T[l].copied:T[l].copy;
    var bs=document.querySelectorAll(".lang button");
    for(var j=0;j<bs.length;j++){bs[j].setAttribute("aria-pressed",bs[j].getAttribute("data-lang")===l?"true":"false");}
    if(persist){try{localStorage.setItem("jpc-lang",l);}catch(e){}}
  }

  var init="zh-Hant",m=/[?&]lang=(en|zh)/.exec(location.search);
  if(m){init=m[1]==="en"?"en":"zh-Hant";}
  else{try{init=localStorage.getItem("jpc-lang")||init;}catch(e){}}
  setLang(init,false);

  var bs=document.querySelectorAll(".lang button");
  for(var k=0;k<bs.length;k++){bs[k].addEventListener("click",function(){setLang(this.getAttribute("data-lang"),true);});}

  var ua=navigator.userAgent||"";
  if(!/Line\/|Teams\/|MicrosoftTeams|FBAN|FBAV|Instagram|MicroMessenger|; wv\)/i.test(ua))return;
  if(/Line\//i.test(ua)&&location.search.indexOf("openExternalBrowser")<0){
    location.replace(location.pathname+"?openExternalBrowser=1"+(m?"&lang="+m[1]:""));
  }
  document.getElementById("hint").hidden=false;
  copyBtn.addEventListener("click",function(){
    var u=location.origin+location.pathname+(cur==="en"?"?lang=en":""),b=this;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(function(){copyState=true;b.textContent=T[cur].copied;},function(){b.textContent=u;});
    }else{b.textContent=u;}
  });
})();
</script>
